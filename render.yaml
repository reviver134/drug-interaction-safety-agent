# Free web hosting; the database is hosted separately on FalkorDB Cloud.
services:
  - type: web
    name: drug-safety
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_SSL
        value: "false"
      - key: FALKORDB_GRAPH
        value: drug_interactions
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_PATIENT_MUTATIONS
        value: "false"
